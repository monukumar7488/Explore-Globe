<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dev Dynamos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #363737;
      color: #333;
    }

    h1 {
      text-align: center;
      padding: 40px 0;
      color: #09f0a3f9;
    }

    /* Updated team container */
    .team-container {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 40px 20px;
      max-width: 100vw;
      box-sizing: border-box;
      overflow-x: hidden; /* No scroll needed now */
    }

    .member {
      flex: 0 0 auto;
      background:  rgb(   144, 224, 239);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
      width: 240px;
      height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .member:hover {
      transform: translateY(-5px);
    }

    .member img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .member h3 {
      color:  rgb(114, 9, 183 );
      margin: 8px 0 4px;
      font-size: 16px;
    }

    .member p {
      font-size: 13px;
      color: #c50b0b;
      margin-bottom: 8px;
    }

    .member a {
      text-decoration: none;
      color:  rgb( 114, 9, 183);
      font-weight: bold;
      font-size: 13px;
    }

    .back-link {
      display: block;
      margin: 30px auto;
      text-align: center;
      font-size: 16px;
      color:  rgb( 114, 9, 183);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

     
      

    /* Optional: Responsive layout for small screens */
    @media (max-width: 1250px) {
      .team-container {
        flex-wrap: wrap;
        justify-content: center;
      }

      .member {
        width: 200px;
        height: 300px;
      }

      .member img {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>
<body>

  

  <h1>Meet Our Team</h1>

  <div class="team-container">
    <!-- Member 1 -->
    <div class="member">
      <img src="nimish2.png" alt="Member 1">
      <h3>Nimish Chauhan</h3>
      <p>Full Stack Developer</p>
      <a href="  https://port-folio-maker-user-end.vercel.app/portfolio/nimish555" target="_blank">View Portfolio</a>
    </div>

    <!-- Member 2 -->
    <div class="member">
      <img src="monu1.jpeg" alt="Member 2">
      <h3>Monu Kumar</h3>
      <p>Full Stack Developer</p>
      <a href="./myportfolio.html" target="_blank">View Portfolio</a>
    </div>

    <!-- Member 3 -->
    <div class="member">
      <img src="./preetiphoto.jpeg" alt="Member 3">
      <h3>Preeti</h3>
      <p>Frontend Developer</p>
      <a href="./preeti.html" target="_blank">View Portfolio</a>
    </div>

    <!-- Member 4 -->
    <div class="member">
      <img src="rahul1.jpeg" alt="Member 4">
      <h3>Rahul Kumar</h3>
      <p>Full Stack Developer</p>
      <a href=" https://port-folio-maker-user-end.vercel.app/portfolio/rahul" target="_blank">View Portfolio</a>
    </div>

    
  </div>

</body>
</html>
