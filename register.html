<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="register-body">

<!-- NAVBAR -->
<nav>
    <img src="./files/logo.png" class="logo" alt="Logo" title="FirstFlight Travels">

    <ul class="navbar">
        <li>
            <a href="./index.html">Home</a>
            <a href="./index.html#locations">Locations</a>
            <a href="./index.html#package">Packages</a>
            <a href="./about.html">About Us</a>

            <a href="./login.html">Login</a>
            <a href="./signup.html">Signup</a>
        </li>
    </ul>
</nav>

<!-- REGISTRATION / BOOKING FORM -->
<section class="registration">
    <div class="register-form">
        <h1> Bookings</h1>

        <form id="registerForm">

            <input type="text" name="myname1" placeholder="Full Name" required>
            <input type="email" name="myemail" placeholder="Email Address" required>
            <input type="tel" name="myphone" id="phonenum" placeholder="Phone Number" required>
            <input type="number" name="myage" placeholder="Age" required>

            <h4>Gender</h4>
            <label>
                <input type="radio" name="mygender" value="Male" required> Male
            </label>
            &nbsp;&nbsp;&nbsp;
            <label>
                <input type="radio" name="mygender" value="Female"> Female
            </label>

            <h4>Departure</h4>
            <input type="datetime-local" name="departuredate" required>

            <h4>Return</h4>
            <input type="datetime-local" name="returndate" required>

            <h4>Travel Destination</h4>
            <label><input type="checkbox" name="td" value="Kashmir"> Kashmir</label>
            <label><input type="checkbox" name="td" value="Istanbul"> Istanbul</label>
            <label><input type="checkbox" name="td" value="Paris"> Paris</label>
            <label><input type="checkbox" name="td" value="Bali"> Bali</label>
            <label><input type="checkbox" name="td" value="Dubai"> Dubai</label>
            <label><input type="checkbox" name="td" value="Geneva"> Geneva</label>
            <label><input type="checkbox" name="td" value="Port Blair"> Port Blair</label>
            <label><input type="checkbox" name="td" value="Rome"> Rome</label>

            <br><br>

            <h4>Package</h4>
            <label><input type="radio" name="locations" value="Bronze" required> Bronze</label>
            <label><input type="radio" name="locations" value="Silver"> Silver</label>
            <label><input type="radio" name="locations" value="Gold"> Gold</label>
            <label><input type="radio" name="locations" value="Platinum"> Platinum</label>

            <br><br>

            <label>
                <input type="checkbox" checked required>
                I accept the Terms & Conditions
            </label>

            <br><br>

            <input type="submit" value="Submit" class="submitbtn">

        </form>
    </div>
</section>

<!-- FOOTER -->
<section class="footer">
    <div class="foot">
        <div class="footer-content">

            <div class="footlinks">
                <h4>Quick Links</h4>
                <ul>

                    <li><a href="./about.html">About Us</a></li>
                    <li><a href="./contact.html">Contact Us</a></li>
                </ul>
            </div>

            <div class="footlinks">
                <h4>Connect</h4>
                <div class="social">
                    <a href="#"><i class='bx bxl-facebook'></i></a>
                    <a href="#"><i class='bx bxl-instagram'></i></a>
                    <a href="#"><i class='bx bxl-twitter'></i></a>
                    <a href="#"><i class='bx bxl-linkedin'></i></a>
                    <a href="#"><i class='bx bxl-github'></i></a>

        </div>
    </div>

    <div class="end">
        <p>
            Copyright © 2026  Explore Globe All Rights Reserved.
        </p>
    </div>
</section>

<!-- JAVASCRIPT -->
<script>
function validateform() {
    const tel = document.getElementById("phonenum").value;
    if (tel.length < 10 || isNaN(tel)) {
        alert("Phone number must be at least 10 digits and numeric.");
        return false;
    }
    return true;
}

document.getElementById("registerForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!validateform()) return;

    const destinations = [];
    document.querySelectorAll('input[name="td"]:checked').forEach(el => {
        destinations.push(el.value);
    });

    const data = {
        name: document.querySelector('input[name="myname1"]').value,
        email: document.querySelector('input[name="myemail"]').value,
        phone: document.querySelector('input[name="myphone"]').value,
        age: document.querySelector('input[name="myage"]').value,
        gender: document.querySelector('input[name="mygender"]:checked').value,
        departure: document.querySelector('input[name="departuredate"]').value,
        returnDate: document.querySelector('input[name="returndate"]').value,
        destinations: destinations,
        package: document.querySelector('input[name="locations"]:checked').value
    };

    try {
        const res = await fetch("http://localhost:5000/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await res.json();
        alert(result.message);
        document.getElementById("registerForm").reset();

    } catch {
        alert("Server error. Please try again later.");
    }
});
</script>

</body>
</html>
